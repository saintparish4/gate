server {
    host = "0.0.0.0"
    host = ${?SERVER_HOST}
 
    port = 8080
    port = ${?SERVER_PORT}

    shutdown-timeout = 30 seconds
    shutdown-timeout = ${?SERVER_SHUTDOWN_TIMEOUT}
}

aws {
    region = "us-east-1"
    region = ${?AWS_REGION}

    # Leave empty for real AWS, set to LocalStack URL for local development 
    endpoint = "" 
    endpoint = ${?AWS_ENDPOINT}

    localstack = false
    localstack = ${?USE_LOCALSTACK}

    dynamodb-endpoint = ${?DYNAMODB_ENDPOINT}
    dynamodbEndpoint = ${?DYNAMODB_ENDPOINT}
    kinesis-endpoint = ${?KINESIS_ENDPOINT}
    kinesisEndpoint = ${?KINESIS_ENDPOINT}

    client {
      max-connections = 50
      max-pending-acquires = 100
      connection-acquisition-timeout-seconds = 5
      connection-time-to-live-seconds = 60
      connection-max-idle-seconds = 5
      disable-sdk-retries = true
    }
}

dynamodb {
  rate-limit-table = "rate-limits"
  rate-limit-table = ${?RATE_LIMIT_TABLE}

  idempotency-table = "idempotency"
  idempotency-table = ${?IDEMPOTENCY_TABLE}

  max-retries = 3
  connection-timeout = 5 seconds
  request-timeout = 10 seconds 
}

idempotency {
  default-ttl-seconds = 86400
  default-ttl-seconds = ${?IDEMPOTENCY_DEFAULT_TTL}
  max-ttl-seconds = 86400
  max-ttl-seconds = ${?IDEMPOTENCY_MAX_TTL_SECONDS}
}

kinesis {
  stream-name = "rate-limit-events"
  stream-name = ${?KINESIS_STREAM}

  enabled = true
  enabled = ${?KINESIS_ENABLED}

  batch-size = 100
  flush-interval = 1 second
  max-retries = 3

  # Bounded circular-buffer queue capacity for the background drain fiber.
  # When full, the oldest event is dropped (observable via DroppedKinesisEvent metric).
  queue-size = 10000
  queue-size = ${?KINESIS_QUEUE_SIZE}
}

rate-limit {
  default-capacity = 100
  default-capacity = ${?RATELIMIT_DEFAULT_CAPACITY} 

  default-refill-rate-per-second = 10.0
  default-refill-rate-per-second = ${?RATELIMIT_DEFAULT_REFILL_RATE} 

  default-ttl-seconds = 3600
  max-cost = 100

  # Algorithm: "token-bucket" | "leaky-bucket" | "sliding-window" (default: sliding-window)
  # token-bucket is the documented default; leaky-bucket and sliding-window are opt-in.
  algorithm = "token-bucket"
  algorithm = ${?RATE_LIMIT_ALGORITHM}

  # Named rate limit profiles for different client tiers 
  profiles {
    free {
      capacity = 20 
      refill-rate-per-second = 2.0 
      ttl-seconds = 3600  
    }

    basic {
      capacity = 100 
      refill-rate-per-second = 10.0 
      ttl-seconds = 3600   
    }

    premium {
      capacity = 1000 
      refill-rate-per-second = 100.0 
      ttl-seconds = 3600    
    }

    enterprise {
      capacity = 10000 
      refill-rate-per-second = 1000.0 
      ttl-seconds = 3600    
    }
  }
}

# ==============================
# Token quota configuration (AI workloads)
# ============================== 

token-quota {
  enabled = false
  enabled = ${?TOKEN_QUOTA_ENABLED}

  table-name = "gate-token-quotas"
  table-name = ${?TOKEN_QUOTA_TABLE}

  # Per-user limits (rolling window)
  user-limit = 1000000
  user-limit = ${?TOKEN_QUOTA_USER_LIMIT}
  user-window-seconds = 3600
  user-window-seconds = ${?TOKEN_QUOTA_USER_WINDOW}

  # Per-agent limits — capped at 80% of user-limit at config load
  agent-limit = 500000
  agent-limit = ${?TOKEN_QUOTA_AGENT_LIMIT}
  agent-window-seconds = 3600
  agent-window-seconds = ${?TOKEN_QUOTA_AGENT_WINDOW}

  # Per-org limits (daily window by default) 
  org-limit = 10000000
  org-limit = ${?TOKEN_QUOTA_ORG_LIMIT}
  org-window-seconds = 86400
  org-window-seconds = ${?TOKEN_QUOTA_ORG_WINDOW} 
}

# ==============================
# Resilience configuration
# ==============================

resilience {
  circuit-breaker {
    enabled = true
    enabled = ${?CIRCUIT_BREAKER_ENABLED}

    dynamodb {
      max-failures = 5
      reset-timeout = 30 seconds
      half-open-max-calls = 3 
    }

    kinesis {
      max-failures = 5 
      reset-timeout = 30 seconds
      half-open-max-calls = 3  
    }
  }

  retry {
    dynamodb {
      max-retries = 3 
      base-delay = 100 milliseconds
      max-delay = 10 seconds
      multiplier = 2.0 
    }

    kinesis {
      max-retries = 3 
      base-delay = 100 milliseconds
      max-delay = 5 seconds 
      multiplier = 2.0  
    }
  }

  bulkhead {
    enabled = true
    enabled = ${?BULKHEAD_ENABLED}

    max-concurrent = 100 
    max-concurrent = ${?BULKHEAD_MAX_CONCURRENT} 

    max-wait = 500 milliseconds 
  }

  timeout {
    rate-limit-check = 2 seconds
    rate-limit-check = ${?TIMEOUT_RATE_LIMIT_CHECK}
    idempotency-check = 2 seconds
    idempotency-check = ${?TIMEOUT_IDEMPOTENCY_CHECK}
    health-check = 5 seconds 
  }

  # Degradation mode when primary storage is unavailable.
  # "reject-all" (fintech-safe default) | "allow-all" (AI infra)
    degradation-mode = "reject-all"
    degradation-mode = ${?DEGRADATION_MODE}
}

# ==============================
# Security configuration
# ==============================

security {
  authentication {
    enabled = true
    enabled = ${?AUTH_ENABLED}
    
    header-name = "Authorization"
    api-key-prefix = "Bearer"
    
    # Rate limiting on the rate limiter (meta!)
    # Per-API-key ceiling that protects the auth middleware against brute-force
    # key guessing. Env override lets load tests (and production tuning) raise
    # this without a code change.
    rate-limit-per-minute = 1000
    rate-limit-per-minute = ${?AUTH_RATE_LIMIT_PER_MINUTE}
    max-failed-attempts = 10
    max-failed-attempts = ${?AUTH_MAX_FAILED_ATTEMPTS}
  }
  
  secrets {
    enabled = false
    enabled = ${?SECRETS_MANAGER_ENABLED}

    # The looked-up secret is "<secret-prefix>/<environment>/<api-keys-secret-name>",
    # so all three have to line up with the name Terraform gives the secret in
    # terraform/modules/secrets/main.tf. They are overridable because the
    # deployed name is "<project>/<environment>/api-keys", not the default.
    secret-prefix = "rate-limiter"
    secret-prefix = ${?SECRETS_PREFIX}

    environment = "dev"
    environment = ${?SECRETS_ENVIRONMENT}

    api-keys-secret-name = "api-keys"
    api-keys-secret-name = ${?API_KEYS_SECRET_NAME}

    cache-ttl = 5 minutes
  }
}

# ==============================
# Metrics configuration
# ==============================

metrics {
  enabled = true
  enabled = ${?METRICS_ENABLED}
  
  namespace = "RateLimiter"
  namespace = ${?METRICS_NAMESPACE}
  
  flush-interval = 60 seconds
  
  # High resolution (1-second) metrics cost extra in CloudWatch
  high-resolution = false
  high-resolution = ${?METRICS_HIGH_RESOLUTION}

  # Maximum number of buffered data points; oldest entries are dropped when full
  max-buffer-size = 50000
  max-buffer-size = ${?METRICS_MAX_BUFFER_SIZE}

  # Trigger an async flush when the buffer reaches this size (before the periodic timer fires)
  flush-threshold = 1000
  flush-threshold = ${?METRICS_FLUSH_THRESHOLD}
}

# ==============================
# Prometheus configuration
# ==============================

prometheus {
  enabled = true
  enabled = ${?PROMETHEUS_ENABLED}
}

# ==============================
# Tracing configuration (OpenTelemetry)
# ==============================

tracing {
  enabled = true
  enabled = ${?TRACING_ENABLED}

  service-name = "gate"
  service-name = ${?OTEL_SERVICE_NAME}

  # OTLP gRPC endpoint for traces (Jaeger, Tempo, etc.)
  exporter-endpoint = "http://localhost:4317"
  exporter-endpoint = ${?OTEL_EXPORTER_OTLP_ENDPOINT}
}

# ==============================
# Cache configuration
# ==============================

cache {
  enabled = true
  enabled = ${?CACHE_ENABLED}
  
  max-size = 10000
  max-size = ${?CACHE_MAX_SIZE}
  
  ttl = 1 second
  ttl = ${?CACHE_TTL}
  
  record-stats = true
}

# ==============================
# Storage configuration
# ==============================

storage {
  # "dynamodb" (default, works with both real AWS and LocalStack) 
  # "in-memory" (unit tests, no external dependencies) 
  backend = "dynamodb"
  backend = ${?STORAGE_BACKEND} 
}

# ==============================
# Audit trail configuration (PCI DSS 4.0.1)
# ==============================

audit {
  enabled = true
  enabled = ${?AUDIT_ENABLED}

  retention-years = 7
  retention-years = ${?AUDIT_RETENTION_YEARS}

  s3-prefix = "audit/"
  s3-prefix = ${?AUDIT_S3_PREFIX}
}