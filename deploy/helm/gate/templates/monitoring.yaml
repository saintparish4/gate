{{- if .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "gate.fullname" . }}
  labels:
    {{- include "gate.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "gate.selectorLabels" . | nindent 6 }}
  endpoints:
    # Every pod behind the Service, so the SLO ratios sum over all replicas.
    - port: http
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      authorization:
        type: Bearer
        credentials:
          name: {{ .Values.metrics.serviceMonitor.adminKeySecret.name }}
          key: {{ .Values.metrics.serviceMonitor.adminKeySecret.key }}
{{- if .Values.aggregator.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "gate.fullname" . }}-usage-aggregator
  labels:
    {{- include "gate.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "gate.aggregatorSelectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
{{- end }}
{{- end }}
{{- if .Values.metrics.prometheusRule.enabled }}
---
# The same rules compose's Prometheus loads (files/rules is a link to
# observability/prometheus/rules), so the two cannot drift.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "gate.fullname" . }}-slo
  labels:
    {{- include "gate.labels" . | nindent 4 }}
    {{- with .Values.metrics.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- .Files.Get "files/rules/slo.yml" | fromYaml | toYaml | nindent 2 }}
{{- end }}
{{- if .Values.metrics.grafanaDashboards.enabled }}
{{- range $path, $_ := .Files.Glob "files/dashboards/*.json" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gate.fullname" $ }}-dashboard-{{ base $path | trimSuffix ".json" }}
  labels:
    {{- include "gate.labels" $ | nindent 4 }}
    {{ $.Values.metrics.grafanaDashboards.label }}: {{ $.Values.metrics.grafanaDashboards.labelValue | quote }}
data:
  {{ base $path }}: |-
    {{- $.Files.Get $path | nindent 4 }}
{{- end }}
{{- end }}
