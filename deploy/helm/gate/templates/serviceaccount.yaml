apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.gate.serviceAccount.name }}
  labels:
    {{- include "gate.labels" . | nindent 4 }}
  {{- with .Values.gate.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- if .Values.aggregator.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.aggregator.serviceAccount.name }}
  labels:
    {{- include "gate.labels" . | nindent 4 }}
  {{- with .Values.aggregator.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
