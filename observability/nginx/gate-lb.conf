# A round-robin load balancer over every replica of the rate-limiter service,
# for docker-compose.scale.yml. nginx resolves the service name once, at start,
# to every replica's address, so start it after the replicas (compose does).
upstream gate {
    server rate-limiter:8080;
    keepalive 64;
}

server {
    listen 8080;

    location / {
        proxy_pass http://gate;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Which replica answered, so a run can show the load was spread.
        add_header X-Gate-Upstream $upstream_addr always;
    }
}
