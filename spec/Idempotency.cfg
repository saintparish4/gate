\* claimIds sent, lost answers retried, skew, claims ending at the lease's edge (MaxOpTime = Ttl - MaxSkew). Expected: pass.
SPECIFICATION Spec
CONSTANTS
  Reqs = {r1, r2, r3}
  Ttl = 3
  MaxTime = 5
  MaxSkew = 1
  MaxOpTime = 2
  MaxReclaims = 1
  ClientRetries = 1
  UseClaimId = TRUE
  AllowAmbiguous = TRUE
INVARIANTS AtMostOnce NoOverlap
CHECK_DEADLOCK FALSE
