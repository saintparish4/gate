\* As Idempotency.cfg, with claims outliving the lease (MaxOpTime = Ttl). Expected: NoOverlap violated. This is the documented lease, not a defect.
SPECIFICATION Spec
CONSTANTS
  Reqs = {r1, r2, r3}
  Ttl = 3
  MaxTime = 6
  MaxSkew = 1
  MaxOpTime = 3
  MaxReclaims = 1
  ClientRetries = 1
  UseClaimId = TRUE
  AllowAmbiguous = TRUE
INVARIANTS AtMostOnce NoOverlap
CHECK_DEADLOCK FALSE
