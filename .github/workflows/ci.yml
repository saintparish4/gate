name: CI

on:
  push:
    branches: [ master, main, develop ]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - 'LICENSE.*'
      - 'CHANGELOG*'
  pull_request:
    branches: [ master, main, develop ]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - 'LICENSE.*'
      - 'CHANGELOG*'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Before the JDK: needs only bash and awk, and a drift is cheaper to learn
    # here than on a deploy. Four env vars shipped set in compose and absent from
    # Terraform before this existed; each cost a deploy cycle to find.
    - name: Check compose/Terraform env drift
      run: ./scripts/check-env-drift.sh

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up SBT
      uses: sbt/setup-sbt@v1

    - name: Cache SBT dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.sbt
          ~/.ivy2/cache
          project/target
        key: ${{ runner.os }}-sbt-${{ hashFiles('**/*.sbt', '**/project/build.properties') }}
        restore-keys: |
          ${{ runner.os }}-sbt-
          
    - name: Check formatting
      run: sbt scalafmtCheckAll

    - name: Compile
      run: sbt compile

    - name: Run unit tests
      run: sbt unitTest
      
    - name: Run integration tests
      run: sbt "testOnly *IntegrationSpec"

  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    needs: [test]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up SBT
      uses: sbt/setup-sbt@v1

    - name: Cache SBT dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.sbt
          ~/.ivy2/cache
          project/target
        key: ${{ runner.os }}-sbt-${{ hashFiles('**/*.sbt', '**/project/build.properties') }}
        restore-keys: |
          ${{ runner.os }}-sbt-

    - name: Start full stack
      run: docker compose up -d
      env:
        AWS_ACCESS_KEY_ID: "test"
        AWS_SECRET_ACCESS_KEY: "test"
        AWS_REGION: "us-east-1"

    - name: Wait for /health (retry 3)
      run: |
        for i in 1 2 3; do
          echo "Health check attempt $i..."
          curl -sf http://localhost:8080/health && break
          [ "$i" -eq 3 ] && echo "Service did not become healthy" && exit 1
          sleep 10
        done

    - name: Smoke — POST /v1/ratelimit/check
      run: |
        curl -sf -X POST http://localhost:8080/v1/ratelimit/check \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer test-api-key" \
          -d '{"key": "smoke-test", "cost": 1}' | tee /dev/stderr | grep -q '"allowed"'

    - name: Smoke — POST /v1/idempotency/check
      run: |
        curl -sf -X POST http://localhost:8080/v1/idempotency/check \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer test-api-key" \
          -d '{"idempotencyKey": "smoke-idem-1", "ttl": 3600}' | tee /dev/stderr | grep -q '"status"'

    - name: Cleanup
      if: always()
      run: docker compose down -v

  correctness:
    name: Correctness invariants
    runs-on: ubuntu-latest
    needs: [smoke]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up SBT
      uses: sbt/setup-sbt@v1

    - name: Cache SBT dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.sbt
          ~/.ivy2/cache
          project/target
        key: ${{ runner.os }}-sbt-${{ hashFiles('**/*.sbt', '**/project/build.properties') }}
        restore-keys: |
          ${{ runner.os }}-sbt-

    - name: Start full stack
      run: docker compose up -d
      env:
        AWS_ACCESS_KEY_ID: "test"
        AWS_SECRET_ACCESS_KEY: "test"
        AWS_REGION: "us-east-1"

    - name: Wait for /ready (up to 120 s)
      run: |
        for i in $(seq 1 24); do
          echo "Readiness attempt $i..."
          if curl -sf http://localhost:8080/ready; then
            echo "Service ready after ${i} attempts."
            exit 0
          fi
          sleep 5
        done
        echo "Service did not become ready within 120 s"
        curl -s http://localhost:8080/ready || true
        docker compose logs --tail 200 rate-limiter || true
        exit 1

    - name: "Run correctness invariants (A: token-bucket non-over-issue, B: idempotency exactly-one-Created, C: quota non-over-admission)"
      run: sbt "loadSim/run --scenario correctness"

    - name: Cleanup
      if: always()
      run: docker compose down -v

